<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#360958"/>
      <stop offset="100%" style="stop-color:#2a0745"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="url(#bg)" stroke="#efc120" stroke-width="5"/>
  <!-- Cross -->
  <rect x="185" y="80" width="30" height="120" rx="5" fill="#efc120"/>
  <rect x="150" y="115" width="100" height="30" rx="5" fill="#efc120"/>
  <!-- Dove / Holy Spirit symbol -->
  <ellipse cx="200" cy="175" rx="18" ry="12" fill="white" opacity="0.9"/>
  <!-- Light rays -->
  <line x1="200" y1="60" x2="200" y2="40" stroke="#efc120" stroke-width="2" opacity="0.6"/>
  <line x1="230" y1="65" x2="245" y2="50" stroke="#efc120" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="65" x2="155" y2="50" stroke="#efc120" stroke-width="2" opacity="0.6"/>
  <!-- ROC text -->
  <text x="200" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="60" font-weight="bold" fill="#efc120" letter-spacing="8">ROC</text>
  <!-- Subtitle -->
  <text x="200" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#ffffff" letter-spacing="3">REALITY OF CHRIST</text>
  <!-- Decorative line -->
  <line x1="130" y1="325" x2="270" y2="325" stroke="#efc120" stroke-width="1.5" opacity="0.5"/>
  <!-- Bottom text -->
  <text x="200" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffffff" opacity="0.7" letter-spacing="2">KANISA LA KRISTO</text>
</svg>
